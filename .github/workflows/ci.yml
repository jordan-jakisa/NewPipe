name: CI

on:
  workflow_dispatch:
  push:
    branches: [dev, master, youtube-only]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Check Kotlin style
        run: ./gradlew :app:runKtlint --stacktrace
      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace -DskipFormatKtlint
